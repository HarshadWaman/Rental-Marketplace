services:
  - type: web
    name: rental-marketplace
    runtime: python
    plan: free
    rootDir: rentalpro
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn rentalpro.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: rental-marketplace.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://rental-marketplace.onrender.com
