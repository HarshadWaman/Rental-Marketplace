databases:
  - name: rental-marketplace-db
    databaseName: rental_marketplace
    user: rental_marketplace_user
    plan: free

services:
  - type: web
    name: rental-marketplace-web
    runtime: python
    plan: free
    rootDir: rentalpro
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && python manage.py ensure_render_superuser && gunicorn rentalpro.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://rental-marketplace-web-kj6q.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: rental-marketplace-db
          property: connectionString
