<div class="contact-actions position-relative z-1 d-flex flex-wrap gap-2 mt-3">
  {% if user.is_authenticated %}
    <a class="btn btn-success flex-fill" href="https://wa.me/{{ item.whatsapp_phone }}?text={{ item.whatsapp_message|urlencode }}" target="_blank" rel="noopener noreferrer">
      <i class="bi bi-whatsapp me-1" aria-hidden="true"></i>WhatsApp
    </a>
    <a class="btn btn-outline-primary flex-fill" href="tel:{{ item.contact_phone }}">
      <i class="bi bi-telephone me-1" aria-hidden="true"></i>Call
    </a>
  {% else %}
    <a class="btn btn-success flex-fill" href="{% url 'ui_preview:login' %}?next={{ request.get_full_path|urlencode }}">
      <i class="bi bi-whatsapp me-1" aria-hidden="true"></i>Log in for WhatsApp
    </a>
    <a class="btn btn-outline-primary flex-fill" href="{% url 'ui_preview:login' %}?next={{ request.get_full_path|urlencode }}">
      <i class="bi bi-telephone me-1" aria-hidden="true"></i>Log in to call
    </a>
  {% endif %}
</div>
