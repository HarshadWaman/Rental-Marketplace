<div class="mb-3">
  {{ field.label_tag }}
  {% if field.field.widget.input_type == 'select' %}
    <select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-select {% if field.errors %}is-invalid{% endif %}">
      {% for value, label in field.field.choices %}
        <option value="{{ value }}"{% if field.value|stringformat:'s' == value|stringformat:'s' %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  {% elif field.field.widget.input_type == 'checkbox' %}
    <div class="form-check">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" class="form-control {% if field.errors %}is-invalid{% endif %}" placeholder="{{ field.field.widget.attrs.placeholder|default:'' }}">
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
</div>
