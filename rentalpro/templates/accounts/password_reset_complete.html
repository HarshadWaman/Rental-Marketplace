{% extends "base.html" %}
{% block title %}Password updated · ToolShare{% endblock %}
{% block content %}
  <div class="auth-card text-center">
    <div class="icon-tile rounded-4 bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-3"><i class="bi bi-check2-circle fs-3" aria-hidden="true"></i></div>
    <h1 class="page-heading h2 fw-bold">Password updated</h1>
    <div class="card card-body p-4 mt-4"><p class="mb-0">Your password has been changed. You can now log in with your new password.</p></div>
    <a class="btn btn-primary mt-4" href="{% url 'ui_preview:login' %}">Log in</a>
  </div>
{% endblock %}
